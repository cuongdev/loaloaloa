name: Deploy relay worker

# Deploys the Cloudflare Worker (relay + landing page at /) on every push to main that touches
# relay-worker/. The real wrangler.toml is git-ignored (it carries account id + KV/D1 ids + the
# Firebase web config), so CI rebuilds it from the WRANGLER_TOML secret before deploying. The FCM
# service-account key lives as a `wrangler secret` on Cloudflare and persists across deploys, so it
# is never needed here.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with "Edit Cloudflare Workers" permission for this account
#   WRANGLER_TOML         — the full contents of relay-worker/wrangler.toml

on:
  push:
    branches: [main]
    paths:
      - "relay-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Write wrangler.toml from secret
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          if [ -z "$WRANGLER_TOML" ]; then
            echo "::error::WRANGLER_TOML secret is empty. Add it in repo settings." >&2
            exit 1
          fi
          printf '%s\n' "$WRANGLER_TOML" > relay-worker/wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: relay-worker
          command: deploy
